<div class="edit-card">
  <div class="edit-header">
    <div>
      <h2 class="edit-title">Editează Preferințele</h2>
      <p class="edit-subtitle">Alege domeniile și categoriile de voluntariat de care ești interesat</p>
    </div>
    <button type="button" class="btn-close" (click)="close.emit()" aria-label="Închide">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  @if (error()) {
    <div class="alert-error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error() }}</span>
    </div>
  }

  <div class="preferences-section">
    <div class="section-header">
      <span class="section-title">Categorii de interes</span>
      <span class="section-counter">{{ selected().length }} selectate</span>
    </div>

    <div class="chips-container">
      @for (item of categories; track item.id) {
        @if (item.category) {
          <button
            type="button"
            class="chip"
            [class.active]="selected().includes(item.category)"
            (click)="toggleCategory(item.category)">
            @if (selected().includes(item.category)) {
              <mat-icon class="chip-icon">check</mat-icon>
            }
            <span>{{ item.name }}</span>
          </button>
        }
      }
    </div>
  </div>

  <div class="edit-actions">
    <button type="button" class="btn-cancel" [disabled]="loading()" (click)="close.emit()">
      Anulează
    </button>
    <button type="button" class="btn-save" [disabled]="loading()" (click)="onSubmit()">
      @if (loading()) {
        <span class="spinner"></span>
        <span>Se salvează...</span>
      } @else {
        <mat-icon>save</mat-icon>
        <span>Salvează preferințele</span>
      }
    </button>
  </div>
</div>
