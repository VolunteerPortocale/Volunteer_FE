<div class="edit-card">
  <div class="edit-header">
    <div>
      <h2 class="edit-title">{{ 'PROFILE.SETTINGS.TITLE' | translate }}</h2>
      <p class="edit-subtitle">{{ 'PROFILE.SETTINGS.SUBTITLE' | translate }}</p>
    </div>
    <button
      type="button"
      class="btn-close"
      (click)="close.emit()"
      [attr.aria-label]="'PROFILE.SETTINGS.CLOSE_ARIA' | translate">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  @if (error()) {
    <div class="alert-error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="edit-form">
    <!-- Language Selection -->
    <div class="form-group">
      <label for="language">{{ 'PROFILE.SETTINGS.LANGUAGE_LABEL' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>language</mat-icon>
        <select id="language" formControlName="language">
          @for (lang of languages; track lang.value) {
            <option [value]="lang.value">{{ lang.labelKey | translate }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Notifications Toggle -->
    <div class="toggle-group">
      <span class="toggle-label">{{ 'PROFILE.SETTINGS.NOTIFICATIONS_LABEL' | translate }}</span>
      <label class="switch">
        <input type="checkbox" formControlName="notificationsEnabled" />
        <span class="slider"></span>
        <span class="switch-status">
          {{ (form.controls.notificationsEnabled.value ? 'PROFILE.SETTINGS.STATUS_ON' : 'PROFILE.SETTINGS.STATUS_OFF') | translate }}
        </span>
      </label>
    </div>

    <!-- 2FA Toggle -->
    <div class="toggle-group">
      <span class="toggle-label">{{ 'PROFILE.SETTINGS.TWO_FACTOR_LABEL' | translate }}</span>
      <label class="switch">
        <input type="checkbox" formControlName="twoFactorEnabled" (change)="onToggle2Fa()" />
        <span class="slider"></span>
        <span class="switch-status">
          {{ (form.controls.twoFactorEnabled.value ? 'PROFILE.SETTINGS.STATUS_ON' : 'PROFILE.SETTINGS.STATUS_OFF') | translate }}
        </span>
      </label>
    </div>

    <!-- OTP Input for 2FA verification -->
    @if (otpSent()) {
      <div class="form-group otp-group">
        <label for="otp">{{ 'PROFILE.SETTINGS.OTP_LABEL' | translate }}</label>
        <div class="input-wrap">
          <mat-icon>pin</mat-icon>
          <input
            id="otp"
            type="text"
            formControlName="otp"
            [placeholder]="'PROFILE.SETTINGS.OTP_PLACEHOLDER' | translate"
            maxlength="6" />
        </div>
      </div>
    }

    <!-- Form Actions -->
    <div class="edit-actions">
      <button type="button" class="btn-cancel" [disabled]="loading()" (click)="close.emit()">
        {{ 'PROFILE.SETTINGS.CANCEL' | translate }}
      </button>
      <button type="submit" class="btn-save" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          <span>{{ 'PROFILE.SETTINGS.SAVING' | translate }}</span>
        } @else {
          <mat-icon>save</mat-icon>
          <span>{{ 'PROFILE.SETTINGS.SAVE' | translate }}</span>
        }
      </button>
    </div>
  </form>
</div>
