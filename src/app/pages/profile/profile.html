<div class="profile-page">
  <!-- Profile Top Hero Banner -->
  <section class="profile-hero-banner">
    <div class="container hero-container">
      <!-- Top Navigation -->
      <div class="top-nav-bar">
        <a routerLink="/home-auth" class="back-link">
          <mat-icon>arrow_back</mat-icon>
          <span>{{ 'PROFILE.BACK_TO_EVENTS' | translate }}</span>
        </a>
      </div>
      <!-- Main Profile Overview -->
      <app-profile-overview
        (editPersonalDetails)="togglePersonalDetails()"
        (editSettings)="toggleSettings()"
      />

      <!-- Edit Personal Details -->
      @if (showPersonalDetails()) {
        <app-edit-personal-details (close)="togglePersonalDetails()" />
      }

      <!-- Profile Settings (Language, 2FA, Notifications) -->
      @if (showSettings()) {
        <app-profile-settings (close)="toggleSettings()" />
      }
    </div>
  </section>
</div>
<app-footer />
