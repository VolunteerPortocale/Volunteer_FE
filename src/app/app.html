<div style="background: black; color: white; padding: 8px 16px; text-align: center; font-size: 14px; font-weight: 500;">
  Environment: <strong>{{ env.envName }}</strong> | API Target: <code>{{ env.apiUrl }}</code>
</div>

<app-navbar />


<main class="container section">
  <div style="margin-bottom: 40px; text-align: center;">
    <h1>Proiecte de Voluntariat în Moldova</h1>
    <p style="max-width: 600px; margin: 0 auto; color: var(--color-medium-grey);">
      Descoperă oportunități de implicare activă în comunitatea ta și ajută la crearea unui viitor mai bun.
    </p>
  </div>

  
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--layout-grid-gap);">
    <app-project-card
      title="Plantăm păduri comunitare"
      category="Ecologie"
      location="Strășeni, Moldova"
      description="Alătură-te echipei noastre pentru a planta peste 2.000 de puieți și a revitaliza spațiile verzi locale."
      imageUrl="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=600&q=80"
    />
    <app-project-card
      title="Educație digitală pentru seniori"
      category="Educație"
      location="Chișinău, Moldova"
      description="Îndrumă persoanele în etate să învețe utilizarea serviciilor digitale, a smartphone-urilor și a internetului."
      imageUrl="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80"
    />
    <app-project-card
      title="Sprijin pentru adăposturile de animale"
      category="Protecția Animalelor"
      location="Bălți, Moldova"
      description="Ajută la îngrijirea, hrănirea și găsirea de familii adoptive pentru animalele abandonate din adăpost."
      imageUrl="https://images.unsplash.com/photo-1548767797-d8c844163c4c?auto=format&fit=crop&w=600&q=80"
    />
  </div>
  <router-outlet />
</main>
