<header class="app-header">
  <mat-toolbar class="header-toolbar">
    <div class="toolbar-content">
      <!-- Brand Logo -->
      <a routerLink="/" class="brand-logo">
        <img src="favicon.ico" alt="Volunteerio Logo" class="brand-logo-img" />
        <span class="brand-title">VOLUNTEERIO</span>
      </a>

      <!-- Navigation Links (Centered, clean navigation) -->
      <nav class="nav-links">
        <a routerLink="/proiecte" class="nav-link">{{ 'NAV.PROJECTS' | translate }}</a>
        <a routerLink="/despre" class="nav-link">{{ 'NAV.ABOUT' | translate }}</a>
        <a routerLink="/organizatii" class="nav-link">{{ 'NAV.ORGANIZATIONS' | translate }}</a>
      </nav>

      <!-- Action Buttons & Language Switcher -->
      <div class="header-actions">
        <!-- 1. Language Dropdown -->
        <button mat-button [matMenuTriggerFor]="langMenu" class="lang-selector-btn">
          <mat-icon class="lang-icon">language</mat-icon>
          <span class="lang-code">{{ translationService.currentLang() | uppercase }}</span>
          <mat-icon class="arrow-icon">arrow_drop_down</mat-icon>
        </button>

        <mat-menu #langMenu="matMenu" class="lang-dropdown-menu">
          <button mat-menu-item (click)="changeLanguage('ro')">
            <span>Română (RO)</span>
          </button>
          <button mat-menu-item (click)="changeLanguage('en')">
            <span>English (EN)</span>
          </button>
          <button mat-menu-item (click)="changeLanguage('ru')">
            <span>Русский (RU)</span>
          </button>
        </mat-menu>

        <!-- 2. Create Event Button (Between Language and Login) -->
        <a mat-button routerLink="/adauga-eveniment" class="btn-primary" style="text-decoration: none;">
          + Adaugă eveniment
        </a>

        <!-- 3. Login Button -->
        <button mat-button class="btn-outline">{{ 'NAV.LOGIN' | translate }}</button>

        <!-- 4. Become Volunteer / Sign Up Button -->
        <button mat-button routerLink="/inregistrare" class="btn-primary">
          {{ 'NAV.BECOME_VOLUNTEER' | translate }}
        </button>
      </div>
    </div>
  </mat-toolbar>
</header>
